# Local development: PostgreSQL with pgvector. Roles insure_owner (migrations) and insure_app
# (runtime, subject to row-level security) are created by docker/postgres/init.
#
# Keycloak and alensi-identity come from the alensi-identity repo:
#   cd ../alensi-identity && docker compose up -d && ./mvnw -pl service spring-boot:run
# Then: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: alensi
      POSTGRES_PASSWORD: alensi
      POSTGRES_DB: alensi_insure
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alensi -d alensi_insure"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
